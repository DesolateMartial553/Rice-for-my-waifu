# 王林 · Wang Lin — hyprlock (hyprlang). Colours: palette.conf (generated)
source = ~/.config/hypr/palette.conf

$font  = GoogleSansCode Nerd Font Propo
$quote = ~/.local/share/wanglin-rice/scripts/lock-text

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = mist, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 4, mist
    animation = fadeOut, 1, 3, mist
    animation = inputFieldDots, 1, 2, mist
}

# Pre-blurred, darkened copy of the wallpaper written by scripts/wallpaper.
background {
    monitor =
    path = ~/.local/state/wanglin-rice/lock.png
    color = $base
}

# Veil behind the left column for legibility
shape {
    monitor =
    size = 34%, 100%
    color = $mantle_a60
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = left
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 84
    font_family = $font ExtraBold
    position = 70, 120
    halign = left
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A · %d %B"
    color = $lavender
    font_size = 17
    font_family = $font
    position = 74, 30
    halign = left
    valign = center
}

# Motto (Chinese if a CJK font is installed)
label {
    monitor =
    text = cmd[update:0] $quote motto
    color = $silver
    font_size = 13
    font_family = $font, Noto Serif CJK SC, Noto Sans CJK SC
    position = 74, -10
    halign = left
    valign = center
}

input-field {
    monitor =
    size = 300, 46
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.45
    dots_center = true
    inner_color = $surface_a90
    outer_color = $lavender $purple 135deg
    check_color = $green
    fail_color = $red
    font_color = $text
    font_family = $font
    fade_on_empty = false
    rounding = 12
    placeholder_text = <span foreground="##9A8FB0">speak the word…</span>
    fail_text = <span foreground="##F0799B">$FAIL ($ATTEMPTS)</span>
    capslock_color = $yellow
    position = 74, -80
    halign = left
    valign = center
}

# Status line: user · battery · layout
label {
    monitor =
    text = cmd[update:30000] $quote status
    color = $muted
    font_size = 11
    font_family = $font
    position = 74, 40
    halign = left
    valign = bottom
}
